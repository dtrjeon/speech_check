html.skin-light{
  --bg:#f0f3f8;--surface:#ffffff;--surface2:#f4f6fb;
  --border:rgba(26,58,176,.13);--border2:rgba(26,58,176,.22);
  --text:#1a1f2e;--text-muted:#4a5568;--text-dim:#8899aa;
  --green:#2e7d32;--green-bg:rgba(46,125,50,.10);--green-border:rgba(46,125,50,.30);
  --red:#c62828;--red-bg:rgba(198,40,40,.10);--red-border:rgba(198,40,40,.28);
  --amber:#f57f17;--amber-bg:rgba(245,127,23,.10);--amber-border:rgba(245,127,23,.28);
  --blue:#1565c0;--blue-bg:rgba(21,101,192,.10);--blue-border:rgba(21,101,192,.28);
  --accent:#1a3ab0;--accent-glow:rgba(26,58,176,.13);
  --clova:#00796b;--clova-bg:rgba(0,121,107,.10);--clova-border:rgba(0,121,107,.30);
}
/* ══ 웜 화이트 스킨 ══ */
html.skin-warm{
  --bg:#faf8f5;--surface:#ffffff;--surface2:#f5f2ee;
  --border:rgba(120,80,20,.13);--border2:rgba(120,80,20,.22);
  --text:#1a1a1a;--text-muted:#5a5248;--text-dim:#a09888;
  --green:#2e7d32;--green-bg:rgba(46,125,50,.10);--green-border:rgba(46,125,50,.28);
  --red:#c62828;--red-bg:rgba(198,40,40,.10);--red-border:rgba(198,40,40,.26);
  --amber:#d97706;--amber-bg:rgba(217,119,6,.10);--amber-border:rgba(217,119,6,.26);
  --blue:#2563eb;--blue-bg:rgba(37,99,235,.10);--blue-border:rgba(37,99,235,.26);
  --accent:#5b4fcf;--accent-glow:rgba(91,79,207,.13);
  --clova:#00796b;--clova-bg:rgba(0,121,107,.10);--clova-border:rgba(0,121,107,.28);
}

/* ══ 스킨 토글 버튼 ══ */
.skin-toggle-btn{
  position:fixed;bottom:20px;right:16px;z-index:100;
  width:48px;height:48px;border-radius:50%;
  border:2px solid var(--border2);
  background:var(--surface);
  color:var(--text);
  font-size:20px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,.25);
  touch-action:manipulation;
  transition:background .25s,border-color .25s,box-shadow .25s;
}
.skin-toggle-btn:hover{
  box-shadow:0 6px 22px rgba(0,0,0,.35);
}
/* 라이트 모드일 때 topbar 색 오버라이드 */
html.skin-light .skin-toggle-btn{
  border-color:rgba(26,58,176,.3);
  box-shadow:0 4px 16px rgba(26,58,176,.15);
}
/* 웜 화이트 모드일 때 토글 버튼 */
html.skin-warm .skin-toggle-btn{
  border-color:rgba(91,79,207,.3);
  box-shadow:0 4px 16px rgba(91,79,207,.15);
}

/* ══ PWA 설치 배너 ══ */
#pwa-banner{
  display:none;
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  width:calc(100% - 32px);max-width:448px;
  background:var(--surface);border:1.5px solid var(--accent);
  border-radius:14px;padding:14px 16px;
  box-shadow:0 8px 32px rgba(0,0,0,.35);
  z-index:200;align-items:center;gap:12px;
  animation:pwa-slide-up .3s ease;
}
#pwa-banner.show{ display:flex; }
@keyframes pwa-slide-up{
  from{opacity:0;transform:translateX(-50%) translateY(20px);}
  to{opacity:1;transform:translateX(-50%) translateY(0);}
}
.pwa-icon{ font-size:28px;flex-shrink:0; }
.pwa-text{ flex:1;min-width:0; }
.pwa-text strong{ display:block;font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px; }
.pwa-text span{ font-size:12px;color:var(--text-muted); }
.pwa-btn-install{
  flex-shrink:0;background:var(--accent);color:#fff;
  border:none;border-radius:8px;padding:8px 14px;
  font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:500;
  cursor:pointer;touch-action:manipulation;white-space:nowrap;
}
.pwa-btn-close{
  flex-shrink:0;background:transparent;border:none;
  color:var(--text-dim);font-size:18px;cursor:pointer;
  padding:4px;touch-action:manipulation;line-height:1;
}
/* iOS 안내 배너 */
#pwa-ios-banner{
  display:none;
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  width:calc(100% - 32px);max-width:448px;
  background:var(--surface);border:1.5px solid var(--blue-border);
  border-radius:14px;padding:14px 16px;
  box-shadow:0 8px 32px rgba(0,0,0,.35);
  z-index:200;flex-direction:column;gap:8px;
  animation:pwa-slide-up .3s ease;
}
#pwa-ios-banner.show{ display:flex; }
.pwa-ios-title{ font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px; }
.pwa-ios-steps{ font-size:12px;color:var(--text-muted);line-height:1.9; }
.pwa-ios-close{
  align-self:flex-end;background:transparent;border:1px solid var(--border2);
  border-radius:6px;padding:4px 10px;font-size:12px;
  color:var(--text-muted);cursor:pointer;touch-action:manipulation;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
html{background:var(--bg);}
html,body{min-height:100%;}
body{background:var(--bg);padding-bottom:env(safe-area-inset-bottom);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.page{max-width:480px;width:100%;margin:0 auto;padding:20px 16px 48px;box-shadow:0 0 40px rgba(0,0,0,0.5);min-height:100vh;}

/* Header */
.header{margin-bottom:22px;}
.tag{display:inline-block;font-size:10px;letter-spacing:.12em;color:var(--accent);border:1px solid var(--accent-glow);background:var(--accent-glow);padding:3px 10px;border-radius:20px;margin-bottom:10px;text-transform:uppercase;}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2;}
.subtitle{margin-top:6px;font-size:13px;color:var(--text-muted);}
.slabel{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;}

/* 배너 */

/* Chapter */
.chapter-section{margin-bottom:20px;}
.mode-row{display:flex;gap:8px;margin-bottom:10px;}
.mode-btn{flex:1;padding:10px 0;border-radius:8px;border:1px solid var(--border2);background:var(--surface2);color:var(--text-muted);font-family:'Noto Sans KR',sans-serif;font-size:13px;cursor:pointer;text-align:center;min-height:44px;touch-action:manipulation;}
.mode-btn.active{background:var(--accent-glow);border-color:var(--accent);color:var(--accent);font-weight:500;}
.chapters-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px;}
.chapter-btn{position:relative;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:12px 12px 11px;cursor:pointer;text-align:left;user-select:none;min-height:58px;touch-action:manipulation;width:100%;}
.chapter-btn.selected{border-color:var(--accent);background:var(--accent-glow);}
.ch-num{font-size:10px;color:var(--text-dim);margin-bottom:3px;}
.chapter-btn.selected .ch-num{color:var(--accent);}
.ch-title{font-size:16px;font-weight:500;color:var(--text);}
.ch-order{position:absolute;top:8px;right:9px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;}
.chapter-btn.selected .ch-order{display:flex;}
.preview-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;min-height:48px;position:relative;}
.box-expand-btn{position:absolute;top:8px;right:8px;background:var(--card);border:1px solid var(--border);border-radius:7px;padding:5px 7px;cursor:pointer;color:var(--text-sub);display:flex;align-items:center;justify-content:center;z-index:10;transition:background .15s,color .15s;}
.box-expand-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.box-expand-btn:active{opacity:.8;}
.preview-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px;}
.preview-chip{background:var(--accent-glow);border:1px solid var(--accent);border-radius:4px;padding:2px 8px;font-size:11px;color:var(--accent);}
.preview-empty{font-size:12px;color:var(--text-dim);}
.outline-lines{margin-top:6px;font-size:13px;line-height:1.9;max-height:340px;overflow-y:auto;padding-right:4px;}

/* ══ 오디오 플레이어 (커스텀) ══ */
.audio-player{
  display:none;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;margin-bottom:10px;
  gap:8px;align-items:center;flex-wrap:nowrap;
}
.audio-player.visible{ display:flex; }
.audio-ch-label{
  font-size:11px;font-weight:500;letter-spacing:.06em;
  color:var(--accent);white-space:nowrap;flex-shrink:0;
}
/* 커스텀 컨트롤 래퍼 */
.ap-controls{
  flex:1.5;min-width:0;display:flex;align-items:center;gap:6px;
}
.ap-play-btn{
  flex-shrink:0;width:32px;height:32px;border-radius:50%;
  border:1.5px solid var(--accent);background:var(--accent-glow);
  color:var(--accent);font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;transition:background .15s;
}
.ap-play-btn:active{ background:var(--accent);color:#fff; }
.ap-time{
  font-size:11px;color:var(--text-muted);white-space:nowrap;flex-shrink:0;
  font-variant-numeric:tabular-nums;
}
.ap-seek-wrap{
  flex:1;min-width:0;height:20px;display:flex;align-items:center;
  cursor:pointer;position:relative;
}
.ap-seek-track{
  width:100%;height:4px;background:var(--border2);border-radius:2px;
  position:relative;overflow:visible;
}
.ap-seek-fill{
  height:100%;background:var(--accent);border-radius:2px;
  width:0%;transition:width .1s linear;pointer-events:none;
}
.ap-seek-thumb{
  position:absolute;top:50%;transform:translate(-50%,-50%);
  width:12px;height:12px;border-radius:50%;background:var(--accent);
  left:0%;pointer-events:none;box-shadow:0 0 0 3px var(--accent-glow);
}
/* ⋮ 버튼 */
.ap-more-btn{
  flex-shrink:0;width:28px;height:28px;border-radius:6px;
  border:1px solid var(--border2);background:transparent;
  color:var(--text-muted);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;position:relative;
}
/* gain 팝업 */
.ap-gain-popup{
  display:none;position:absolute;bottom:36px;right:0;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:10px;padding:12px 14px;min-width:180px;
  box-shadow:0 6px 24px rgba(0,0,0,.3);z-index:500;
}
.ap-gain-popup.open{ display:block; }
.ap-gain-label{
  font-size:11px;color:var(--text-muted);margin-bottom:8px;letter-spacing:.04em;
}
.ap-gain-row{
  display:flex;align-items:center;gap:8px;
}
.ap-gain-val{
  font-size:13px;font-weight:600;color:var(--accent);
  white-space:nowrap;min-width:28px;text-align:right;
}
.ap-popup-divider{
  height:1px;background:var(--border);margin:10px 0;
}
.ap-popup-row{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;
}
.ap-popup-row:last-child{ margin-bottom:0; }
.ap-popup-label{
  font-size:11px;color:var(--text-muted);white-space:nowrap;min-width:48px;
}
.ap-speed-btn{
  flex:1;padding:4px 0;border-radius:5px;border:1px solid var(--border2);
  background:transparent;color:var(--text-muted);font-size:11px;
  cursor:pointer;touch-action:manipulation;text-align:center;
}
.ap-speed-btn.active{
  border-color:var(--accent);color:var(--accent);background:var(--accent-glow);
}
.ap-dl-btn{
  width:100%;padding:7px 0;border-radius:7px;
  border:1px solid var(--border2);background:var(--surface2);
  color:var(--text-muted);font-size:12px;cursor:pointer;
  touch-action:manipulation;
}
.ap-dl-btn:active{ background:var(--border); }
html.skin-light .audio-player{
  background:#f4f6fb;border-color:rgba(26,58,176,.14);
}
html.skin-light .audio-ch-label{ color:#1a3ab0; }
.audio-toggle-btn{
  flex-shrink:0;
  background:transparent;border:1px solid var(--border2);
  border-radius:6px;padding:4px 9px;
  font-size:11px;font-weight:500;
  color:var(--text-muted);cursor:pointer;
  white-space:nowrap;touch-action:manipulation;
  transition:all .15s;
}
.audio-toggle-btn.on{
  border-color:var(--accent);color:var(--accent);background:var(--accent-glow);
}
.audio-toggle-btn.off{
  border-color:var(--red-border);color:var(--red);background:var(--red-bg);
}
html.skin-light .audio-toggle-btn.on{
  border-color:#1a3ab0;color:#1a3ab0;background:rgba(26,58,176,.10);
}
html.skin-light .audio-toggle-btn.off{
  border-color:rgba(198,40,40,.3);color:#c62828;background:rgba(198,40,40,.08);
}
/* ══ 오디오 싱크 하이라이트 ══ */
.outline-line-sync{
  background:var(--accent-glow);
  border-left:3px solid var(--accent);
  padding-left:6px;margin-left:-9px;
  border-radius:4px;
  color:var(--text) !important;
  transition:background .3s;
}
html.skin-light .outline-line-sync{
  background:rgba(26,58,176,.10);
  border-left-color:#1a3ab0;
  color:#1a1f2e !important;
}
.outline-line-rec{color:var(--text);font-weight:400;}
.outline-line-skip{color:var(--text-dim);font-size:12px;}
.outline-line-only{color:var(--blue);font-weight:400;}
html.skin-light .outline-line-only{color:#1565c0;}
.outline-label-skip{color:var(--text-dim);font-size:12px;}
.outline-toggle{cursor:pointer;border-radius:4px;padding:1px 4px;margin:-1px -4px;transition:background .15s;}
.outline-toggle:hover{background:rgba(124,106,255,.13);}
.outline-legend{display:flex;gap:6px;margin:6px 0 4px;font-size:11px;align-items:center;}
.legend-rec{color:var(--text);}
.legend-skip{color:var(--text-dim);}
.outline-reset-btn{margin-left:auto;background:transparent;border:1px solid var(--border2);color:var(--text-muted);border-radius:5px;padding:2px 9px;font-size:11px;cursor:pointer;}
.outline-reset-btn:hover{border-color:var(--accent);color:var(--accent);}
.outline-ab-btn{background:transparent;border:1px solid var(--border2);color:var(--text-muted);border-radius:5px;padding:2px 9px;font-size:11px;cursor:pointer;margin-left:2px;}
.outline-ab-btn:hover{border-color:var(--accent);color:var(--accent);}
.outline-ab-btn.ab-active{border-color:var(--accent);color:var(--accent);background:var(--accent-glow);}
html.skin-light .outline-ab-btn{border-color:rgba(32,80,200,.2);color:#6070a0;}
html.skin-light .outline-ab-btn.ab-active{border-color:#2050c8;color:#2050c8;background:rgba(32,80,200,.08);}
.outline-save-btn{background:transparent;border:1px solid var(--border2);color:var(--text-muted);border-radius:5px;padding:2px 7px;font-size:11px;cursor:pointer;margin-left:2px;}
.outline-save-btn:hover{border-color:var(--accent);color:var(--accent);}
html.skin-light .outline-reset-btn{border-color:rgba(32,80,200,.2);color:#6070a0;}
html.skin-light .outline-reset-btn:hover{border-color:#2050c8;color:#2050c8;}
html.skin-light .outline-save-btn{border-color:rgba(32,80,200,.2);color:#6070a0;}
html.skin-light .outline-save-btn:hover{border-color:#2050c8;color:#2050c8;}
html.skin-light .outline-line-rec{color:#1a1e3a;}
html.skin-light .outline-line-skip{color:#aab0c8;}
html.skin-light .outline-label-skip{color:#aab0c8;}
html.skin-light .outline-toggle:hover{background:rgba(32,80,200,.08);}
html.skin-light .legend-rec{color:#1a1e3a;}
html.skin-light .legend-skip{color:#aab0c8;}

.btn-fontsize{background:transparent;border:1px solid var(--border2);color:var(--text-muted);border-radius:5px;padding:2px 8px;font-size:12px;cursor:pointer;margin-right:6px;line-height:1.4;}
.btn-fontsize:hover{border-color:var(--accent);color:var(--accent);}
.ch-fontsize-btn{position:absolute;bottom:8px;right:8px;background:transparent;border:1px solid var(--border2);border-radius:5px;padding:1px 6px;font-size:11px;cursor:pointer;color:var(--text-muted);line-height:1.4;z-index:5;}
.ch-fontsize-btn:hover{border-color:var(--accent);color:var(--accent);}
html.skin-light .ch-fontsize-btn{border-color:rgba(32,80,200,.2);color:#6070a0;}
html.skin-light .ch-fontsize-btn:hover{border-color:#2050c8;color:#2050c8;}
html.skin-light .btn-fontsize{border-color:rgba(32,80,200,.2);color:#6070a0;}
html.skin-light .btn-fontsize:hover{border-color:#2050c8;color:#2050c8;}

/* 원본 텍스트 카드 */
.input-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px;}
.input-card-header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface2);}
.card-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.card-title{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);}
textarea{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:300;line-height:1.7;padding:14px;resize:none;min-height:90px;}
textarea::placeholder{color:var(--text-dim);}

/* ════════════ 라이트 스킨 추가 오버라이드 ════════════ */
html.skin-light body{background:var(--bg);}
html.skin-light .tag{background:rgba(26,58,176,.10);border-color:rgba(26,58,176,.25);color:#1a3ab0;}
html.skin-light h1{color:#1a1f2e;}
html.skin-light .chapter-btn{background:#fff;border-color:rgba(26,58,176,.18);}
html.skin-light .chapter-btn.selected{background:rgba(26,58,176,.08);border-color:#1a3ab0;}
html.skin-light .chapter-btn.selected .ch-num{color:#1a3ab0;}
html.skin-light .ch-order{background:#1a3ab0;}
html.skin-light .mode-btn{background:#fff;border-color:rgba(26,58,176,.20);color:var(--text-muted);}
html.skin-light .mode-btn.active{background:rgba(26,58,176,.10);border-color:#1a3ab0;color:#1a3ab0;}
html.skin-light .preview-chip{background:rgba(26,58,176,.10);border-color:#1a3ab0;color:#1a3ab0;}
html.skin-light .input-card{background:#fff;border-color:rgba(26,58,176,.14);}
html.skin-light .input-card-header{background:#f4f6fb;border-color:rgba(26,58,176,.12);}
html.skin-light textarea{background:#fff;color:#1a1f2e;}
html.skin-light .input-tab.active-mic{color:#c62828;border-bottom-color:#c62828;background:#fff;}
html.skin-light .input-tab.active-clova{color:#00796b;border-bottom-color:#00796b;background:#fff;}
html.skin-light .btn-rec-main.recording{background:#c62828;color:#fff;border-color:#c62828;}
html.skin-light .btn-permission.granted{border-color:rgba(46,125,50,.30);background:rgba(46,125,50,.08);color:#2e7d32;}
html.skin-light .btn-save.ready{border-color:rgba(46,125,50,.30);background:rgba(46,125,50,.08);color:#2e7d32;}
html.skin-light .legend{background:#f4f6fb;border-color:rgba(26,58,176,.12);}
html.skin-light .preview-box{background:#f4f6fb;border-color:rgba(26,58,176,.12);}

/* ════════════ 웜 화이트 스킨 추가 오버라이드 ════════════ */
html.skin-warm body{background:var(--bg);}
html.skin-warm .tag{background:rgba(91,79,207,.10);border-color:rgba(91,79,207,.25);color:#5b4fcf;}
html.skin-warm h1{color:#1a1a1a;}
html.skin-warm .chapter-btn{background:#fff;border-color:rgba(120,80,20,.15);}
html.skin-warm .chapter-btn.selected{background:rgba(91,79,207,.08);border-color:#5b4fcf;}
html.skin-warm .chapter-btn.selected .ch-num{color:#5b4fcf;}
html.skin-warm .ch-order{background:#5b4fcf;}

<script>
/* 챕터 데이터(CHAPTERS)는 chapters-data.js, STT 오인식 교정 사전(STT_FIXES)은
   stt-fixes-data.js 에서 로드됨 */

/* ════════════ 상태 ════════════ */
let mode = 'single', selected = [];
// ★ v2.52: 원문에 "아들아[딸아]"처럼 표기된 대체 가능 단어 쌍을 저장.
// normLine 등에서 이 패턴을 발견할 때마다 채워짐(원본 텍스트 표시에 사용).
let altPairs = {};

/* ════════════ 챕터 ════════════ */
var chFontSizes = [100, 105, 110, 115, 120, 125];
var previewFontIdx = 0;
function previewFontStep(){
  previewFontIdx = (previewFontIdx + 1) % chFontSizes.length;
  var pct = chFontSizes[previewFontIdx];
  var box = document.getElementById('outline-lines-box');
  if(box) box.style.fontSize = (13 * pct / 100) + 'px';
  var btn = document.getElementById('preview-fs-btn');
  if(btn) btn.title = '글자 크기: ' + pct + '%';
}
/* ════════════ 오디오 플레이어 ════════════ */
var audioDisabled = (function(){
  try{ return JSON.parse(localStorage.getItem('ee-audio-off') || '{}'); }catch(e){ return {}; }
})();
function saveAudioDisabled(){
  try{ localStorage.setItem('ee-audio-off', JSON.stringify(audioDisabled)); }catch(e){}
}

/* 복수 선택 순차 재생용 큐 */
var _audioQueue = [];   // 재생할 챕터 id 순서
var _audioQueueIdx = 0; // 현재 재생 중인 큐 인덱스

function _loadAudioByQueueIdx(idx){
  const audioEl = document.getElementById('audio-el');
  const label   = document.getElementById('audio-ch-label');
  if(idx >= _audioQueue.length){ clearAudioSync(); return; }
  const ch = CHAPTERS.find(c => c.id === _audioQueue[idx]);
  if(!ch || !ch.audio){ _loadAudioByQueueIdx(idx + 1); return; }
  _audioQueueIdx = idx;
  label.textContent = '🎧 ' + ch.num +
    (_audioQueue.length > 1 ? '  (' + (idx+1) + '/' + _audioQueue.length + ')' : '');
  const newSrc = ch.audio;
  if(audioEl.getAttribute('src') !== newSrc){
    audioEl.pause();
    audioEl.setAttribute('src', newSrc);
    audioEl.load();
  }
  audioEl._syncChId = ch.id;
  audioEl.removeEventListener('timeupdate', audioSyncHandler);
  audioEl.addEventListener('timeupdate', audioSyncHandler);
  // AudioContext suspended 상태면 resume (모바일 재생 차단 방지)
  if(_audioCtx && _audioCtx.state === 'suspended') _audioCtx.resume();
}

function updateAudioPlayer(){
  const player    = document.getElementById('audio-player');
  const audioEl   = document.getElementById('audio-el');
  const label     = document.getElementById('audio-ch-label');
  const toggleBtn = document.getElementById('audio-toggle-btn');

  // audio 있는 챕터만 필터링
  const audioChs = selected.map(id => CHAPTERS.find(c => c.id === id)).filter(c => c && c.audio);

  if(audioChs.length > 0){
    const firstCh = audioChs[0];
    const isOff   = !!audioDisabled[firstCh.id];

    // 토글 버튼: 단일일 때만 표시 (복수일 때는 숨김)
    toggleBtn.style.display = selected.length === 1 ? '' : 'none';
    if(selected.length === 1){
      toggleBtn.textContent = isOff ? 'OFF' : 'ON';
      toggleBtn.className   = 'audio-toggle-btn ' + (isOff ? 'off' : 'on');
    }

    if(isOff && selected.length === 1){
      audioEl.pause();
      audioEl.removeAttribute('src');
      clearAudioSync();
      label.textContent = '🎧 ' + firstCh.num;
      document.getElementById('ap-controls').style.display = 'none';
      document.getElementById('ap-more-btn').parentElement.style.display = 'none';
      player.classList.add('visible');
      return;
    }

    document.getElementById('ap-controls').style.display = '';
    document.getElementById('ap-more-btn').parentElement.style.display = '';

    // 큐 업데이트
    const newQueue = audioChs.map(c => c.id);
    const queueChanged = JSON.stringify(newQueue) !== JSON.stringify(_audioQueue);
    _audioQueue = newQueue;

    if(queueChanged){
      _audioQueueIdx = 0;
      _loadAudioByQueueIdx(0);
    }

    player.classList.add('visible');
    return;
  }

  // 챕터 미선택 or audio 없음 → 숨기고 정지
  _audioQueue = [];
  audioEl.pause();
  audioEl.removeAttribute('src');
  audioEl.style.display = '';
  player.classList.remove('visible');
}

document.getElementById('audio-toggle-btn').addEventListener('click', function(){
  if(selected.length !== 1) return;
  const ch = CHAPTERS.find(c => c.id === selected[0]);
  if(!ch || !ch.audio) return;
  if(audioDisabled[ch.id]){
    delete audioDisabled[ch.id];
  } else {
    audioDisabled[ch.id] = true;
  }
  saveAudioDisabled();
  updateAudioPlayer();
});

/* ════════════ 오디오 싱크 ════════════ */
function clearAudioSync(){
  document.querySelectorAll('.outline-line-sync').forEach(el => el.classList.remove('outline-line-sync'));
}
function _onAudioEnded(){
  clearAudioSync();
  if(_audioQueueIdx + 1 < _audioQueue.length){
    _loadAudioByQueueIdx(_audioQueueIdx + 1);
    document.getElementById('audio-el').play();
  }
}
document.getElementById('audio-el').addEventListener('ended', _onAudioEnded);

/* ════════════ 커스텀 플레이어 컨트롤 ════════════ */
(function(){
  const audioEl  = document.getElementById('audio-el');
  const playBtn  = document.getElementById('ap-play-btn');
  const curEl    = document.getElementById('ap-cur');
  const durEl    = document.getElementById('ap-dur');
  const fillEl   = document.getElementById('ap-seek-fill');
  const thumbEl  = document.getElementById('ap-seek-thumb');
  const seekWrap = document.getElementById('ap-seek-wrap');
  const moreBtn  = document.getElementById('ap-more-btn');
  const gainPopup= document.getElementById('ap-gain-popup');

  function fmt(s){
    s = Math.floor(s||0);
    return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);
  }
  function updateSeek(){
    const pct = audioEl.duration ? (audioEl.currentTime / audioEl.duration)*100 : 0;
    fillEl.style.width  = pct+'%';
    thumbEl.style.left  = pct+'%';
    curEl.textContent   = fmt(audioEl.currentTime);
  }

  // 재생/일시정지
  playBtn.addEventListener('click', function(){
    if(_audioCtx && _audioCtx.state==='suspended') _audioCtx.resume();
    if(audioEl.paused){ audioEl.play(); playBtn.textContent='⏸'; }
    else              { audioEl.pause(); playBtn.textContent='▶'; }
  });

  audioEl.addEventListener('play',  function(){ playBtn.textContent='⏸'; });
  audioEl.addEventListener('pause', function(){ playBtn.textContent='▶'; });
  audioEl.addEventListener('ended', function(){ playBtn.textContent='▶'; updateSeek(); });

  audioEl.addEventListener('timeupdate', updateSeek);
  audioEl.addEventListener('durationchange', function(){
    durEl.textContent = fmt(audioEl.duration);
  });
  audioEl.addEventListener('loadedmetadata', function(){
    durEl.textContent = fmt(audioEl.duration);
    fillEl.style.width='0%'; thumbEl.style.left='0%'; curEl.textContent='0:00';
    playBtn.textContent='▶';
  });

  // 시크 (터치/클릭)
  function seek(e){
    if(!audioEl.duration) return;
    const rect = seekWrap.getBoundingClientRect();
    const x    = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const pct  = Math.max(0, Math.min(1, x / rect.width));
    audioEl.currentTime = pct * audioEl.duration;
    updateSeek();
  }
  let seeking = false;
  seekWrap.addEventListener('touchstart', function(e){ seeking=true; seek(e); }, {passive:true});
  seekWrap.addEventListener('touchmove',  function(e){ if(seeking) seek(e); }, {passive:true});
  seekWrap.addEventListener('touchend',   function(){ seeking=false; });
  seekWrap.addEventListener('mousedown',  function(e){ seeking=true; seek(e); });
  document.addEventListener('mousemove',  function(e){ if(seeking) seek(e); });
  document.addEventListener('mouseup',    function(){ seeking=false; });

  // ⋮ 팝업 토글
  moreBtn.addEventListener('click', function(e){
    e.stopPropagation();
    gainPopup.classList.toggle('open');
  });
  document.addEventListener('click', function(){ gainPopup.classList.remove('open'); });
  gainPopup.addEventListener('click', function(e){ e.stopPropagation(); });

  // 재생 속도
  document.querySelectorAll('.ap-speed-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      const spd = parseFloat(this.dataset.speed);
      audioEl.playbackRate = spd;
      document.querySelectorAll('.ap-speed-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      try{ localStorage.setItem('ee-audio-speed', spd); }catch(e){}
    });
  });
  // 저장된 속도 복원
  (function(){
    const saved = parseFloat(localStorage.getItem('ee-audio-speed'));
    if(!isNaN(saved)){
      audioEl.playbackRate = saved;
      document.querySelectorAll('.ap-speed-btn').forEach(function(b){
        b.classList.toggle('active', parseFloat(b.dataset.speed) === saved);
      });
    }
  })();

  // 다운로드
  document.getElementById('ap-dl-btn').addEventListener('click', function(){
    const src = audioEl.getAttribute('src');
    if(!src) return;
    const a = document.createElement('a');
    a.href = src; a.download = '';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  });
})();

/* ════════════ 오디오 볼륨 증폭 (Web Audio API) ════════════ */
var _audioGainNode = null;
var _audioCtx = null;
(function(){
  const GAIN_KEY = 'ee-audio-gain';
  const audioEl = document.getElementById('audio-el');
  audioEl.volume = 1.0;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    _audioCtx = ctx;
    const src = ctx.createMediaElementSource(audioEl);
    const gain = ctx.createGain();
    const saved = parseFloat(localStorage.getItem(GAIN_KEY));
    gain.gain.value = (!isNaN(saved) && saved >= 1 && saved <= 5) ? saved : 2.5;
    src.connect(gain);
    gain.connect(ctx.destination);
    _audioGainNode = gain;
    // 모바일: 터치/클릭마다 suspended면 resume
    function resumeCtx(){ if(ctx.state === 'suspended') ctx.resume(); }
    document.addEventListener('touchstart', resumeCtx);
    document.addEventListener('click', resumeCtx);
  } catch(e) {
    console.log('Web Audio API 미지원:', e);
  }

  // 슬라이더 초기값 세팅 및 이벤트
  const slider = document.getElementById('gain-slider');
  const label  = document.getElementById('gain-value-label');
  const savedVal = parseFloat(localStorage.getItem(GAIN_KEY));
  const initVal  = (!isNaN(savedVal) && savedVal >= 1 && savedVal <= 5) ? savedVal : 2.5;
  slider.value = initVal;
  label.textContent = '×' + initVal;

  slider.addEventListener('input', function(){
    const v = parseFloat(this.value);
    label.textContent = '×' + v;
    if(_audioGainNode) _audioGainNode.gain.value = v;
    try{ localStorage.setItem(GAIN_KEY, v); }catch(e){}
  });
})();
function audioSyncHandler(){
  const audioEl = document.getElementById('audio-el');
  const chId = audioEl._syncChId;
  if(!chId) return;
  const ch = CHAPTERS.find(c => c.id === chId);
  if(!ch || !ch.lines) return;
  const cur = audioEl.currentTime;
  // ts 있는 r:true 라인만 대상
  const tsLines = ch.lines.map((l,i) => ({...l, _i:i})).filter(l => l.r && l.ts !== undefined);
  if(!tsLines.length) return;
  // 현재 시간에 해당하는 라인 인덱스 찾기
  let activeIdx = -1;
  for(let i = 0; i < tsLines.length; i++){
    if(cur >= tsLines[i].ts){
      activeIdx = tsLines[i]._i;
    }
  }
  // 기존 하이라이트 제거 후 새 라인 강조
  clearAudioSync();
  if(activeIdx >= 0){
    const lineEl = document.getElementById('sync-line-' + chId + '-' + activeIdx);
    if(lineEl){
      lineEl.classList.add('outline-line-sync');
      lineEl.scrollIntoView({block:'nearest', behavior:'smooth'});
    }
  }
}

document.getElementById('mode-single').addEventListener('click', () => setMode('single'));
document.getElementById('mode-multi').addEventListener('click',  () => setMode('multi'));
function setMode(m){
  mode = m; selected = [];
  document.getElementById('mode-single').classList.toggle('active', m==='single');
  document.getElementById('mode-multi').classList.toggle('active',  m==='multi');
  updateChapterUI();
  updateAudioPlayer();
}
function toggleChapter(id){
  if(mode==='single'){ selected = selected[0]===id ? [] : [id]; }
  else{ const i=selected.indexOf(id); if(i===-1) selected.push(id); else selected.splice(i,1); }
  updateChapterUI();
  updateAudioPlayer();
}
function updateChapterUI(){
  altPairs = {}; // ★ v2.52: 챕터 재선택마다 대체표현 맵 초기화 (이전 챕터 정보 잔류 방지)
  CHAPTERS.forEach(ch => {
    const btn = document.getElementById('ch-btn-'+ch.id);
    const ord = document.getElementById('ch-order-'+ch.id);
    if(!btn || !ord) return;
    const idx = selected.indexOf(ch.id);
    btn.classList.toggle('selected', idx !== -1);
    ord.textContent = (idx !== -1 && mode === 'multi') ? (idx+1) : '';
  });
  const box = document.getElementById('preview-box');
  if(selected.length === 0){
    box.innerHTML = '<div class="preview-empty">챕터를 선택하면 원본이 자동으로 설정됩니다</div>';
    document.getElementById('original').value = ''; return;
  }
  // ── 원본 텍스트 정제 공통 함수 ──
  const BIBLE_REF_RE = /^[가-힣]+\s+\d+장\s+[\d절\s]+\s*/;
  function normLine(t){
    t = t.replace(/\[SKIP\].*?\[\/SKIP\]/g,' ').replace(/\s+/g,' ').trim();
    if(t.startsWith('전: ')) t = t.slice('전: '.length);
    if(t.startsWith('대: ')) t = t.slice('대: '.length);
    if(t.startsWith('주제 전환 ')) t = t.slice('주제 전환 '.length);
    else if(BIBLE_REF_RE.test(t)) t = t.replace(BIBLE_REF_RE,'');
    else t = t.replace(/^[1-9]\d*\s+/,'');
    t = numToKor(t);
    // ★ v2.52: "아들아[딸아]" 같은 대체표현 쌍을 altPairs에 기록하고, 원문 표시에는
    // 기본형(아들아)만 남김. [SKIP] 제거보다 뒤, 문장부호 제거보다 앞에서 처리해야
    // 대괄호가 살아있는 상태에서 정확히 인식됨.
    t = t.replace(/([가-힣a-zA-Z0-9]+)\[([가-힣a-zA-Z0-9]+)\]/g, (m, a, b) => {
      altPairs[a] = b; altPairs[b] = a;
      return a;
    });
    // ★ v2.48: 문장부호(따옴표 등)를 삭제 대신 공백으로 치환 — 옆 단어와 붙어버리는 것 방지
    return t.replace(/[^가-힣a-zA-Z0-9\s.?!…○]/g,' ').replace(/\s+/g,' ').trim();
  }

  const combined = selected.map(id => {
    const ch = CHAPTERS.find(c=>c.id===id);
    if(!ch) return '';
    if(ch.lines) return ch.lines.filter(l=>l.r).map(l=>normLine(l.t)).join(' ');
    return numToKor((ch.text||'')
      .replace(/([가-힣a-zA-Z0-9]+)\[([가-힣a-zA-Z0-9]+)\]/g, (m,a,b)=>{ altPairs[a]=b; altPairs[b]=a; return a; })
      .replace(/[^가-힣a-zA-Z0-9\s.?!…○]/g,' ').replace(/\s+/g,' ').trim());
  }).join(' ');
  const chips = selected.map(id => {
    const c = CHAPTERS.find(x=>x.id===id);
    if(!c) return '';
    return `<span class="preview-chip">${c.num} ${c.title}</span>`;
  }).join('');

  // lines 배열을 가진 챕터 단독 선택 시 색상 구분 표시
  const singleOutlineCh = selected.length === 1 ? CHAPTERS.find(c=>c.id===selected[0]) : null;
  const singleOutline = !!(singleOutlineCh && singleOutlineCh.lines);
  if(singleOutline){
    const ch = singleOutlineCh;
    if(!ch || !ch.lines){ 
      box.innerHTML = `<div class="preview-chips">${chips}</div>`;
      document.getElementById('original').value = combined;
      return;
    }

    // 개요B(id:10) 전용: A/B 모드 저장
    if(ch.id === 9 && !ch._abMode) ch._abMode = 'B';

    // 기본값 저장 (최초 1회)
    if(!ch._defaultR) ch._defaultR = ch.lines.map(l => l.r);

    function buildRecText(){
      return ch.lines.filter(l=>l.r).map(l=>normLine(l.t)).join('\n');
    }
    function renderOutlineLines(){
      const lineHtml = ch.lines.map((l, idx) => {
        let html;
        if(l.t.startsWith('주제 전환 ')){
          const rest = l.t.slice('주제 전환 '.length);
          const isBlackLine = rest.startsWith('선생님께서');
          if(isBlackLine){
            html = `<span class="outline-label-skip">주제 전환</span> <span style="color:var(--text);font-weight:500;">${rest}</span>`;
          } else {
            html = `<span class="outline-label-skip">주제 전환</span> ${rest}`;
          }
        } else {
          const numMatch = l.t.match(/^([1-9]\d*\s)(.+)$/);
          if(numMatch){
            html = `<span class="outline-label-skip">${numMatch[1]}</span>${numMatch[2]}`;
          } else {
            html = l.t;
          }
        }
        // [SKIP]...[/SKIP] 인라인 제외 표시
        html = html.replace(/\[SKIP\](.*?)\[\/SKIP\]/g, '<span class="outline-label-skip">$1</span>');
        const cls = l.r ? 'outline-line-rec' : 'outline-line-skip';
        const bibleBooks = ['에베소서','로마서','요한일서','출애굽기','이사야','사도행전','요한복음','요한계시록','창세기','레위기','민수기','신명기','시편','잠언','고린도','갈라디아','빌립보','골로새','데살로니가','디모데','히브리서','야고보','베드로'];
        const isBibleLine = bibleBooks.some(b => l.t.startsWith(b));
        const bibleMatch = isBibleLine && l.t.match(/^([가-힣]+\s+\d+장\s+[\d절\s]+)\s+(.+)$/);
        const isAbAMode = selected[0] === 9 && ch._abMode === 'A';

        // 요약 복음(id:11): 암기개요에 없는 문구는 파란색
        const isFull11 = selected[0] === 10;
        if(isFull11 && !isBibleLine){
          const chMemo = CHAPTERS.find(c=>c.id===9);
          function norm(s){
            return s
              .replace(/^에베소서\s+\d+장\s+[\d절\s]+/,'')
              .replace(/^성경은\s*/,'')
              .replace(/\(엡[^)]*\)라고 말씀하십니다\.?$/,'')
              .replace(/라고 말씀하십니다\.?$/,'')
              .replace(/\[SKIP\].*?\[\/SKIP\]/g,'')
              .replace(/[,，、]/g,'').replace(/\s+/g,'').replace(/\.$/,'').trim();
          }
          const memoNorm = chMemo ? new Set(chMemo.lines.map(x=>norm(x.t))) : new Set();
          const memoFull = chMemo ? chMemo.lines.map(x=>norm(x.t)).join(' ') : '';
          const lineNorm = norm(l.t);
          const inMemo = memoNorm.has(lineNorm) || memoFull.includes(lineNorm);

          // "성경은 ...라고 말씀하십니다" 형태: 앞뒤는 파랑, 본문은 검정
          const bibleSayMatch = l.t.match(/^(성경은\s+)(.*?)(\([^)]+\)라고 말씀하십니다\.?)$/s)
            || l.t.match(/^(성경은\s+)(.*?)(라고 말씀하십니다\.?)$/s);
          // "하지만 ...라고 말씀하십니다" 형태: 하지만+(출...) 파랑, 본문 검정
          const butSayMatch = !bibleSayMatch && (
            l.t.match(/^(하지만\s+)(.*?)(\([^)]+\)라고 말씀하십니다\.?)$/s)
            || l.t.match(/^(하지만\s+)(.*?)(라고 말씀하십니다\.?)$/s)
          );
          if(bibleSayMatch || butSayMatch){
            const m = bibleSayMatch || butSayMatch;
            const mid = m[2].replace(/\[SKIP\](.*?)\[\/SKIP\]/g, '<span class="outline-label-skip">$1</span>');
            const colorHtml = `<span style="color:var(--blue);">${m[1]}</span>${mid}<span style="color:var(--blue);">${m[3]}</span>`;
            return `<div class="outline-line-rec outline-toggle" id="sync-line-${ch.id}-${idx}" data-idx="${idx}" title="클릭하여 녹음 포함/제외 전환">${colorHtml}</div>`;
          }

          if(l.r && !inMemo){
            return `<div class="outline-line-only outline-toggle" id="sync-line-${ch.id}-${idx}" data-idx="${idx}" title="클릭하여 녹음 포함/제외 전환">${html}</div>`;
          }
        }

        if(bibleMatch){
          const isOutlineBMode = selected[0] === 9 && !isAbAMode;
          if(isOutlineBMode){
            html = `<span class="outline-label-skip">${bibleMatch[1]}</span> <span style="color:var(--blue);">${bibleMatch[2]}</span>`;
          } else {
            html = `<span class="outline-label-skip">${bibleMatch[1]}</span> ${bibleMatch[2]}`;
          }
          const bibleCls = isAbAMode ? 'outline-line-skip' : 'outline-line-rec';
          return `<div class="${bibleCls} outline-toggle" id="sync-line-${ch.id}-${idx}" data-idx="${idx}" title="클릭하여 녹음 포함/제외 전환">${html}</div>`;
        }
        // 암기개요B(id:10): bibleBooks로 시작하지만 장/절 패턴 미매칭인 성경 라인도 파란색
        if(selected[0] === 9 && isBibleLine && !isAbAMode){
          html = `<span style="color:var(--blue);">${l.t}</span>`;
          const bibleCls = 'outline-line-rec';
          return `<div class="${bibleCls} outline-toggle" id="sync-line-${ch.id}-${idx}" data-idx="${idx}" title="클릭하여 녹음 포함/제외 전환">${html}</div>`;
        }
        return `<div class="${cls} outline-toggle" id="sync-line-${ch.id}-${idx}" data-idx="${idx}" title="클릭하여 녹음 포함/제외 전환">${html}</div>`;
      }).join('');
      const isFull = ch.id === 10;
      const isOutlineB = ch.id === 9;
      box.innerHTML = `
        <button class="box-expand-btn" id="box-expand-btn" title="전체화면으로 보기">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
            <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
          </svg>
        </button>
        <div class="preview-chips">${chips}</div>
        <div class="outline-legend">
          <span class="legend-rec">● 녹음 대상</span>
          <span class="legend-skip">● 제외</span>
          ${isFull ? `<span class="outline-line-only" style="font-size:11px;">● 요약 복음 전용</span>` : ''}
          ${isOutlineB ? `
            <button class="outline-ab-btn ab-active" id="outline-btn-ab" data-ab="${ch._abMode||'B'}">
              암기개요${ch._abMode||'B'}
            </button>
          ` : ''}
          <span class="ch-fontsize-btn" id="preview-fs-btn" title="글자 크기 증가" style="position:static;margin-left:2px;" onclick="previewFontStep()">가<sup>+</sup></span>
          ${!isFull ? '<button class="outline-reset-btn" id="outline-reset-btn" title="기본값으로 초기화">🗑 초기화</button>' : ''}
          ${isFull ? `<button class="outline-reset-btn" id="outline-init-btn" title="저장 상태 초기화">🗑 초기화</button>` : ''}
        </div>
        <div class="outline-lines" id="outline-lines-box">${lineHtml}</div>`;

      // 챕터 폰트 크기 복원
      const outBox = box.querySelector('#outline-lines-box');
      if(outBox && previewFontIdx > 0){
        outBox.style.fontSize = (13 * chFontSizes[previewFontIdx] / 100) + 'px';
      }

      // 클릭 토글
      box.querySelectorAll('.outline-toggle').forEach(el => {
        el.addEventListener('click', function(){
          const idx = parseInt(this.dataset.idx);
          ch.lines[idx].r = !ch.lines[idx].r;
          // 전체 재렌더 없이 해당 줄 클래스만 변경 (위치 유지)
          this.className = (ch.lines[idx].r ? 'outline-line-rec' : 'outline-line-skip') + ' outline-toggle';
          const recText = buildRecText();
          document.getElementById('original').value = recText;
        });
      });

      // 암기개요 A/B 토글 버튼
      if(isOutlineB){
        const bibleBooks = ['에베소서','로마서','요한일서','출애굽기','이사야','사도행전','요한복음','요한계시록','창세기','레위기','민수기','신명기','시편','잠언','고린도','갈라디아','빌립보','골로새','데살로니가','디모데','히브리서','야고보','베드로'];

        const abBtn = document.getElementById('outline-btn-ab');
        if(abBtn){
          abBtn.addEventListener('click', function(e){
            e.stopPropagation();
            // 현재 모드에서 반대로 토글
            const nextMode = (ch._abMode === 'A') ? 'B' : 'A';
            ch._abMode = nextMode;
            this.dataset.ab = nextMode;
            this.textContent = '암기개요' + nextMode;
            if(nextMode === 'A'){
              ch.lines.forEach((l, i) => {
                const isBible = bibleBooks.some(b => l.t.startsWith(b));
                l.r = isBible ? false : ch._defaultR[i];
              });
            } else {
              ch.lines.forEach((l, i) => { l.r = ch._defaultR[i]; });
            }
            const recText = buildRecText();
            document.getElementById('original').value = recText;
            renderOutlineLines();
          });
        }
      }
      const resetBtn = document.getElementById('outline-reset-btn');
      if(resetBtn){
        resetBtn.addEventListener('click', function(e){
          e.stopPropagation();
          // 기본값으로 초기화 (저장 상태 무시)
          ch.lines.forEach((l, i) => { l.r = ch._defaultR[i]; });
          const recText = buildRecText();
          document.getElementById('original').value = recText;
          // 폰트 크기 초기화
          previewFontIdx = 0;
          const ob = document.getElementById('outline-lines-box');
          if(ob) ob.style.fontSize = '';
          const fb = document.getElementById('preview-fs-btn');
          if(fb) fb.title = '글자 크기 증가';
          renderOutlineLines();
        });
      }

      // 저장 버튼 (id:10 요약 복음 전용)
      const saveBtn = document.getElementById('outline-save-btn');
      if(saveBtn){
        // 저장된 상태 있으면 버튼 강조
        const hasSaved = (() => { try{ return !!localStorage.getItem('outline_saved_'+ch.id); }catch(e){ return false; } })();
        if(hasSaved) saveBtn.style.borderColor = 'var(--accent)';
        saveBtn.addEventListener('click', function(e){
          e.stopPropagation();
          const state = ch.lines.map(l => l.r);
          try{ localStorage.setItem('outline_saved_'+ch.id, JSON.stringify(state)); }catch(e){}
          this.textContent = '✓ 저장됨';
          this.style.borderColor = 'var(--accent)';
          this.style.color = 'var(--accent)';
          setTimeout(() => { this.innerHTML = '<span id="save-icon" style="font-size:22px;line-height:1;">💾</span>'; }, 1500);
        });
      }

      // 초기화 버튼 (저장된 상태 삭제 후 기본값으로)
      const initBtn = document.getElementById('outline-init-btn');
      if(initBtn){
        initBtn.addEventListener('click', function(e){
          e.stopPropagation();
          try{ localStorage.removeItem('outline_saved_'+ch.id); }catch(e){}
          ch.lines.forEach((l, i) => { l.r = ch._defaultR[i]; });
          const recText = buildRecText();
          document.getElementById('original').value = recText;
          // 저장 버튼 색상도 초기화
          const sb = document.getElementById('outline-save-btn');
          if(sb){ sb.style.borderColor=''; sb.style.color=''; }
          // 폰트 크기 초기화
          previewFontIdx = 0;
          const ob = document.getElementById('outline-lines-box');
          if(ob) ob.style.fontSize = '';
          const fb = document.getElementById('preview-fs-btn');
          if(fb) fb.title = '글자 크기 증가';
          renderOutlineLines();
        });
      }
      const recText = buildRecText();
      document.getElementById('original').value = recText;
    }

    renderOutlineLines();
  } else {
    // 복수선택: 챕터별 lines 렌더링 + 경계선
    const multiHtml = selected.map((id, si) => {
      const ch = CHAPTERS.find(c=>c.id===id);
      if(!ch) return '';
      let linesHtml = '';
      if(ch.lines){
        linesHtml = ch.lines.map(l => {
          let txt = l.t;
          // SKIP 태그 → 회색 span
          txt = txt.replace(/\[SKIP\](.*?)\[\/SKIP\]/g,'<span class="outline-label-skip">$1</span>');
          // 주제 전환 라인 — l.r 에 따라 녹음대상/제외 구분 (단일선택과 동일)
          if(l.t.startsWith('주제 전환 ')){
            const rest = l.t.slice('주제 전환 '.length);
            const cls2 = l.r ? 'outline-line-rec' : 'outline-line-skip';
            return `<div class="${cls2}"><span class="outline-label-skip">주제 전환</span> ${rest}</div>`;
          }
          // 번호 접두사
          const numMatch = txt.match(/^([1-9]\d*)\s+(.+)$/s);
          if(numMatch) txt = `<span class="outline-label-num">${numMatch[1]}</span>${numMatch[2]}`;
          const cls = l.r ? 'outline-line-rec' : 'outline-line-skip';
          return `<div class="${cls}">${txt}</div>`;
        }).join('');
      } else {
        linesHtml = (ch.text||'').split('\n').map(t=>
          `<div class="outline-line-rec">${t}</div>`
        ).join('');
      }
      const divider = si > 0
        ? `<div style="border-top:2px dashed var(--border2);margin:10px 0 8px;display:flex;align-items:center;gap:8px;">
             <span style="font-size:11px;color:var(--text-muted);white-space:nowrap;">${ch.num} ${ch.title}</span>
             <span style="flex:1;border-top:1px solid var(--border2);"></span>
           </div>`
        : `<div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;">${ch.num} ${ch.title}</div>`;
      return divider + linesHtml;
    }).join('');

    box.innerHTML = `
      <button class="box-expand-btn" id="box-expand-btn" title="전체화면으로 보기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
          <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
        </svg>
      </button>
      <div class="preview-chips">${chips}</div>
      <div class="outline-lines" id="outline-lines-box" style="margin-top:8px;">${multiHtml}</div>`;

    // 원본 텍스트: 챕터별 r:true 항목 합산
    const multiRecText = selected.map(id => {
      const ch = CHAPTERS.find(c=>c.id===id);
      if(!ch) return '';
      if(ch.lines) return ch.lines.filter(l=>l.r).map(l=>normLine(l.t)).join('\n');
      return numToKor((ch.text||'')
        .replace(/([가-힣a-zA-Z0-9]+)\[([가-힣a-zA-Z0-9]+)\]/g, (m,a,b)=>{ altPairs[a]=b; altPairs[b]=a; return a; })
        .replace(/[^가-힣a-zA-Z0-9\s.?!…○]/g,' ').replace(/\s+/g,' ').trim());
    }).filter(Boolean).join('\n');
    document.getElementById('original').value = multiRecText;
    return;
  }
  document.getElementById('original').value = combined;
}

/* ════════════ 챕터 확대 ════════════ */
(function(){
  const modal    = document.getElementById('chapter-expand-modal');
  const body     = document.getElementById('chapter-expand-body');
  const closeBtn = document.getElementById('chapter-expand-close');

  function open(){
    const outlineEl = document.getElementById('outline-lines-box');
    if(outlineEl){
      body.innerHTML = outlineEl.innerHTML;
      body.querySelectorAll('[data-idx]').forEach(el => {
        el.style.pointerEvents = 'none';
        el.removeAttribute('data-idx');
      });
    } else {
      const orig = document.getElementById('original').value || '';
      body.innerHTML = orig.split('\n').filter(Boolean).map(l =>
        `<div class="outline-line-rec">${l}</div>`
      ).join('');
    }
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    body.style.fontSize = getFontSize() + 'px'; // ★ v2.84: 저장된 글자 크기 적용
  }

  function close(){
    modal.classList.remove('open');
    document.body.style.overflow = '';
  }

  // ★ v2.84: 챕터 원본 확대 모달의 글자 크기 조절(가-/가+).
  // 핀치줌(브라우저 전체 화면 확대)은 레이아웃 폭이 그대로라 줄바꿈된 문장이
  // 화면 밖으로 밀려나 보일 수 있음. 대신 이 버튼으로 박스 안에서 글자 크기만
  // 키우면 줄바꿈 폭이 유지되어 화면을 벗어나지 않음. 마지막 설정은 기기에 저장됨.
  const FONT_MIN = 13, FONT_MAX = 26, FONT_STEP = 2;
  function getFontSize(){
    let saved = null;
    try{ saved = parseInt(localStorage.getItem('chapterExpandFontSize'), 10); }catch(e){}
    return (saved && saved >= FONT_MIN && saved <= FONT_MAX) ? saved : 15;
  }
  function setFontSize(px){
    const clamped = Math.max(FONT_MIN, Math.min(FONT_MAX, px));
    body.style.fontSize = clamped + 'px';
    try{ localStorage.setItem('chapterExpandFontSize', String(clamped)); }catch(e){}
  }
  document.getElementById('chapter-font-plus').addEventListener('click', () => setFontSize(getFontSize() + FONT_STEP));
  document.getElementById('chapter-font-minus').addEventListener('click', () => setFontSize(getFontSize() - FONT_STEP));

  document.getElementById('preview-box').addEventListener('click', function(e){
    if(e.target.closest('#box-expand-btn')) open();
  });

  closeBtn.addEventListener('click', close);
})();

/* ════════════ 원본 텍스트 전체보기 ════════════ */
(function(){
  var modal = document.getElementById('fulltext-modal');
  var body  = document.getElementById('fulltext-body');
  var openBtn  = document.getElementById('btn-fulltext');
  var closeBtn = document.getElementById('fulltext-close-btn');

  // 글자 크기 증가 버튼 (100% ~ 150%, 5%씩)
  var fontSizes = [100, 105, 110, 115, 120, 125, 130, 135, 140, 145, 150];
  var fontSizeIdx = 0;
  var originalTextarea = document.getElementById('original');
  document.getElementById('btn-fontsize').addEventListener('click', function(){
    fontSizeIdx = (fontSizeIdx + 1) % fontSizes.length;
    var pct = fontSizes[fontSizeIdx];
    originalTextarea.style.fontSize = (15 * pct / 100) + 'px';
    this.title = '글자 크기: ' + pct + '%';
    this.innerHTML = '가<sup>' + pct + '%</sup>';
  });

  function open(){
    var txt = document.getElementById('original').value || '(입력된 텍스트가 없습니다)';
    body.textContent = txt;
    body.style.fontSize = (15 * fontSizes[fontSizeIdx] / 100) + 'px';
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function close(){
    modal.classList.remove('open');
    document.body.style.overflow = '';
  }

  openBtn.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
})();

/* ════════════ 스킨 토글 (dark → warm → light 순환) ════════════ */
(function(){
  var STORAGE_KEY = 'ee-skin';
  var btn = document.getElementById('skin-toggle-btn');
  var metaTheme = document.getElementById('meta-theme-color');
  var SKINS = ['dark', 'warm', 'light'];
  var ICONS = { dark:'🌙', warm:'☀️', light:'💙' };
  var TITLES = { dark:'웜 화이트로 변경', warm:'라이트로 변경', light:'다크로 변경' };
  var META  = { dark:'#0e0f11', warm:'#faf8f5', light:'#f0f3f8' };

  function applyTheme(skin){
    document.documentElement.classList.remove('skin-light','skin-warm');
    if(skin === 'light') document.documentElement.classList.add('skin-light');
    if(skin === 'warm')  document.documentElement.classList.add('skin-warm');
    btn.textContent = ICONS[skin];
    btn.title = TITLES[skin];
    if(metaTheme) metaTheme.setAttribute('content', META[skin]);
  }

  var saved = localStorage.getItem(STORAGE_KEY) || 'light';
  applyTheme(saved);

  btn.addEventListener('click', function(){
    var current = localStorage.getItem(STORAGE_KEY) || 'dark';
    var idx = SKINS.indexOf(current);
    var next = SKINS[(idx + 1) % SKINS.length];
    localStorage.setItem(STORAGE_KEY, next);
    applyTheme(next);
  });
})();

/* ════════════ 온라인 상태 표시 ════════════ */
(function(){
  const dot = document.getElementById('online-dot');
  function setOnline(on){
    if(!dot) return;
    if(on){
      dot.style.background = '#4ade80';
      dot.style.boxShadow  = '0 0 0 2px rgba(74,222,128,.25)';
      dot.title = '온라인 연결';
    } else {
      dot.style.background = '#f87171';
      dot.style.boxShadow  = '0 0 0 2px rgba(248,113,113,.2)';
      dot.title = '오프라인';
    }
  }
  function check(){
    setOnline(navigator.onLine);
  }
  window.addEventListener('online',  () => setOnline(true));
  window.addEventListener('offline', () => setOnline(false));
  check(); // 초기 상태
})();

renderChapters();

/* ════════════ PWA 설치 배너 ════════════ */
(function(){
  var STORAGE_KEY = 'pwa-banner-dismissed';
  var androidBanner = document.getElementById('pwa-banner');
  var iosBanner = document.getElementById('pwa-ios-banner');
  var deferredPrompt = null;

  function isDismissed(){ try{ return localStorage.getItem(STORAGE_KEY); }catch(e){ return false; } }
  function isStandalone(){ return window.matchMedia('(display-mode:standalone)').matches || window.navigator.standalone === true; }
  function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
  function isIOSSafari(){ return isIOS() && /safari/i.test(navigator.userAgent) && !/crios|fxios/i.test(navigator.userAgent); }

  if(isStandalone() || isDismissed()) return;

  // Android Chrome
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    setTimeout(function(){
      if(!isStandalone() && !isDismissed()) androidBanner.classList.add('show');
    }, 3000);
  });

  document.getElementById('pwa-install-btn').addEventListener('click', function(){
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(result){
      deferredPrompt = null;
      androidBanner.classList.remove('show');
      if(result.outcome === 'accepted') try{ localStorage.setItem(STORAGE_KEY,'1'); }catch(e){}
    });
  });

  document.getElementById('pwa-close-btn').addEventListener('click', function(){
    androidBanner.classList.remove('show');
    try{ localStorage.setItem(STORAGE_KEY,'1'); }catch(e){}
  });

  // iOS Safari
  if(isIOSSafari()){
    setTimeout(function(){
      if(!isStandalone() && !isDismissed()) iosBanner.classList.add('show');
    }, 3000);
  }

  document.getElementById('pwa-ios-close-btn').addEventListener('click', function(){
    iosBanner.classList.remove('show');
    try{ localStorage.setItem(STORAGE_KEY,'1'); }catch(e){}
  });
})();
</script>
